[pytest]
testpaths = tests
# Open defects are left out of the normal run; run them alone with: pytest -m known_defect
addopts = -ra --strict-markers --alluredir=allure-results -m "not known_defect"
markers =
    smoke: quick check of the most critical flows
    ui: tests that drive the browser
    api: tests that call the REST APIs directly
    integration: tests that act in the UI and check the result through the API
    known_defect: tests that expose an open defect; skipped by default (run with -m known_defect)
